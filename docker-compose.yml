version: "3.9"

services:
  app:
    build: .
    ports:
      - "8080:8080"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hub_user
      POSTGRES_PASSWORD: hub_pass
      POSTGRES_DB: the_hub
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hub_user -d the_hub"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: