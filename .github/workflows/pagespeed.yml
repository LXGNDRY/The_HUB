# ============================================================
# Legendary Branding — Google PageSpeed Insights Runner
# Runs mobile + desktop PageSpeed audit and prints all data
# ============================================================

name: 📊 Legendary PageSpeed Audit

on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL to audit (default: legendary-branding.com)"
        required: false
        default: "https://legendary-branding.com"
        type: string
  schedule:
    # Run every day at 8am CST (14:00 UTC)
    - cron: "0 14 * * *"

jobs:
  pagespeed:
    name: 📊 PageSpeed Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run PageSpeed Audit — Mobile + Desktop
        env:
          PAGESPEED_API_KEY: ${{ secrets.PAGESPEED_API_KEY }}
          PAGESPEED_URL: ${{ github.event.inputs.url || 'https://legendary-branding.com' }}
        run: python scripts/run_pagespeed.py

      - name: Upload results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pagespeed-results
          path: pagespeed_results.json
          retention-days: 30
