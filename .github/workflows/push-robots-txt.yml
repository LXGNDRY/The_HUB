name: Push robots.txt v2.0.0 to live Shopify theme

on:
  workflow_dispatch:

jobs:
  push-robots-txt:
    name: Deploy robots.txt to active Shopify theme
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push robots.txt.liquid to Shopify
        env:
          SHOPIFY_ADMIN_TOKEN: ${{ secrets.SHOPIFY_ADMIN_TOKEN }}
        run: bash scripts/push_robots_txt.sh