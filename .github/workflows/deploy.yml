name: Legacy deployment quarantined

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quarantined:
    runs-on: ubuntu-latest
    steps:
      - name: Block insecure legacy deployment
        run: |
          echo "This legacy workflow is quarantined because it used public invoker IAM and plaintext service-account/provider secrets." >&2
          echo "Use the Workload Identity Federation deployment workflow after completing the production-readiness gates." >&2
          exit 1
