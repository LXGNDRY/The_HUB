# ============================================================
# GCP Bot — GitHub Actions CI/CD Workflow
# Deploy to Google Cloud Run on push to main
# Manual trigger available via workflow_dispatch
# ============================================================

name: 🤖 GCP Bot — Build & Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run in DRY_RUN mode (no real GCP changes)"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"
      environment:
        description: "Target environment"
        required: false
        default: "production"
        type: choice
        options:
          - production
          - staging

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  SERVICE_NAME: gcp-bot
  REGION: us-central1
  IMAGE: gcr.io/${{ secrets.GCP_PROJECT_ID }}/gcp-bot

jobs:
  # ─────────────────────────────────────────
  # JOB 1: Lint & Test
  # ─────────────────────────────────────────
  test:
    name: 🧪 Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest

      - name: Lint with flake8
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Warn on complexity / style (non-blocking)
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

      - name: Run tests (if tests/ exists)
        run: |
          if [ -d "tests" ]; then
            pytest tests/ -v --tb=short
          else
            echo "No tests/ directory found — skipping pytest."
          fi

  # ─────────────────────────────────────────
  # JOB 2: Build & Push Docker Image
  # ─────────────────────────────────────────
  build:
    name: 🐳 Build & Push Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker --quiet

      - name: Build & Push Docker image
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          IMAGE_TAG="${{ env.IMAGE }}:${SHORT_SHA}"

          docker build \
            --tag "${IMAGE_TAG}" \
            --tag "${{ env.IMAGE }}:latest" \
            --label "git-commit=${{ github.sha }}" \
            --label "build-date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            .

          docker push "${IMAGE_TAG}"
          docker push "${{ env.IMAGE }}:latest"
          echo "✅ Image pushed: ${IMAGE_TAG}"

  # ─────────────────────────────────────────
  # JOB 3: Deploy to Cloud Run
  # ─────────────────────────────────────────
  deploy:
    name: 🚀 Deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Write env-vars file
        run: |
          DRY_RUN_VAL="${{ github.event.inputs.dry_run || 'false' }}"
          # gcloud --env-vars-file expects KEY=VALUE, one per line
          # Simple scalars go here; JSON blobs are handled via Secret Manager refs below
          cat > /tmp/envvars.yaml <<EOF
          GCP_PROJECT_ID: "${{ secrets.GCP_PROJECT_ID }}"
          DASHBOARD_API_KEY: "${{ secrets.DASHBOARD_API_KEY }}"
          GA4_PROPERTY_ID: "${{ secrets.GA4_PROPERTY_ID }}"
          GOOGLE_API_KEY: "${{ secrets.GOOGLE_API_KEY }}"
          BUDGET_THRESHOLD: "${{ secrets.BUDGET_THRESHOLD }}"
          IDLE_CPU_THRESHOLD: "${{ secrets.IDLE_CPU_THRESHOLD }}"
          QUOTA_ALERT_PERCENT: "${{ secrets.QUOTA_ALERT_PERCENT }}"
          DRY_RUN: "${DRY_RUN_VAL}"
          EOF

      - name: Push JSON secrets to Secret Manager
        run: |
          PROJECT="${{ secrets.GCP_PROJECT_ID }}"

          push_secret() {
            local NAME=$1
            local VALUE=$2
            # Create or add new version
            if gcloud secrets describe "${NAME}" --project="${PROJECT}" &>/dev/null; then
              printf '%s' "${VALUE}" | gcloud secrets versions add "${NAME}" \
                --project="${PROJECT}" --data-file=-
            else
              printf '%s' "${VALUE}" | gcloud secrets create "${NAME}" \
                --project="${PROJECT}" --data-file=- --replication-policy=automatic
            fi
          }

          push_secret "GCP_SA_KEY_JSON"    '${{ secrets.GCP_SA_KEY }}'
          push_secret "GSC_TOKEN_JSON"     '${{ secrets.GSC_TOKEN_JSON }}'

          # Grant Cloud Run default compute SA access to these secrets
          # Cloud Run uses: <project-number>-compute@developer.gserviceaccount.com
          PROJECT_NUMBER=$(gcloud projects describe "${PROJECT}" --format='value(projectNumber)')
          SA="${PROJECT_NUMBER}-compute@developer.gserviceaccount.com"
          echo "Granting Secret Accessor to: ${SA}"
          for SECRET in GCP_SA_KEY_JSON GSC_TOKEN_JSON; do
            gcloud secrets add-iam-policy-binding "${SECRET}" \
              --project="${PROJECT}" \
              --member="serviceAccount:${SA}" \
              --role="roles/secretmanager.secretAccessor"
          done

      - name: Deploy to Cloud Run
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          IMAGE_TAG="${{ env.IMAGE }}:${SHORT_SHA}"

          echo "Deploying image: ${IMAGE_TAG}"

          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image "${IMAGE_TAG}" \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 1 \
            --max-instances 3 \
            --port 8080 \
            --env-vars-file=/tmp/envvars.yaml \
            --set-secrets="GCP_SA_KEY_JSON=GCP_SA_KEY_JSON:latest,GSC_TOKEN_JSON=GSC_TOKEN_JSON:latest" \
            --quiet

      - name: Get Cloud Run service URL
        id: service_url
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region ${{ env.REGION }} \
            --format="value(status.url)")
          echo "url=${URL}" >> $GITHUB_OUTPUT
          echo "🌐 Service URL: ${URL}"

      - name: Smoke test — health check
        run: |
          URL="${{ steps.service_url.outputs.url }}"
          echo "Running health check against ${URL}/health ..."
          for i in 1 2 3; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${URL}/health" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✅ Health check passed (HTTP 200)"
              exit 0
            fi
            echo "Attempt $i: HTTP $STATUS — retrying in 5s..."
            sleep 5
          done
          echo "⚠️  Health check did not return 200 — deployment may still be starting up."
          exit 0

      - name: Deployment summary
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          IMAGE_TAG="${{ env.IMAGE }}:${SHORT_SHA}"
          echo "### 🚀 Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Service** | ${{ env.SERVICE_NAME }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Region** | ${{ env.REGION }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Image** | \`${IMAGE_TAG}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **URL** | ${{ steps.service_url.outputs.url }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Dry Run** | ${{ github.event.inputs.dry_run || 'false' }} |" >> $GITHUB_STEP_SUMMARY
