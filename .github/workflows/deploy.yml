# ============================================================
# GCP Bot — GitHub Actions CI/CD Workflow
# Deploy to Google Cloud Run on push to main
# ============================================================

name: 🤖 GCP Bot — Build & Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run in DRY_RUN mode (no real GCP changes)"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

env:
  PROJECT_ID:   ${{ secrets.GCP_PROJECT_ID }}
  SERVICE_NAME: gcp-bot
  REGION:       us-central1
  IMAGE:        gcr.io/${{ secrets.GCP_PROJECT_ID }}/gcp-bot

jobs:
  # ─────────────────────────────────────────
  # JOB 1: Lint & Test
  # ─────────────────────────────────────────
  test:
    name: 🧪 Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install --upgrade pip && pip install -r requirements.txt flake8 pytest
      - run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
      - run: flake8 . --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics
      - run: "[ -d tests ] && pytest tests/ -v --tb=short || echo 'No tests/ — skipping.'"

  # ─────────────────────────────────────────
  # JOB 2: Build & Push Docker Image
  # ─────────────────────────────────────────
  build:
    name: 🐳 Build & Push Image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
      - run: gcloud auth configure-docker --quiet
      - name: Build & Push
        run: |
          SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          docker build \
            --tag "${{ env.IMAGE }}:${SHA}" \
            --tag "${{ env.IMAGE }}:latest" \
            --label "git-commit=${{ github.sha }}" .
          docker push "${{ env.IMAGE }}:${SHA}"
          docker push "${{ env.IMAGE }}:latest"

  # ─────────────────────────────────────────
  # JOB 3: Deploy to Cloud Run
  #
  # JSON secret strategy:
  #   Step 1 — gcloud run deploy with all SCALAR env vars + --clear-secrets
  #             to wipe any stale Secret Manager refs from prior deploys.
  #   Step 2 — Python reads JSON secrets from step env: block (safe, no shell
  #             expansion), calls gcloud run services describe to get current
  #             spec, patches the env list, writes YAML, runs services replace.
  # ─────────────────────────────────────────
  deploy:
    name: 🚀 Deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      # ── Step 1: Deploy scalar env vars, clear all Secret Manager refs ──
      - name: Deploy scalar env vars
        run: |
          SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          IMAGE_TAG="${{ env.IMAGE }}:${SHA}"
          DRY_RUN="${{ github.event.inputs.dry_run || 'false' }}"

          echo "Deploying image: ${IMAGE_TAG}"

          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image "${IMAGE_TAG}" \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 1 \
            --max-instances 1 \
            --port 8080 \
            --clear-secrets \
            --set-env-vars "GCP_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }},DASHBOARD_API_KEY=${{ secrets.DASHBOARD_API_KEY }},GA4_PROPERTY_ID=${{ secrets.GA4_PROPERTY_ID }},GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY }},BUDGET_THRESHOLD=${{ secrets.BUDGET_THRESHOLD }},IDLE_CPU_THRESHOLD=${{ secrets.IDLE_CPU_THRESHOLD }},QUOTA_ALERT_PERCENT=${{ secrets.QUOTA_ALERT_PERCENT }},DRY_RUN=${DRY_RUN},PAGESPEED_URL=${{ secrets.PAGESPEED_URL }},PAGESPEED_API_KEY=${{ secrets.PAGESPEED_API_KEY }},HIGGSFIELD_API_KEY_ID=${{ secrets.HIGGSFIELD_API_KEY_ID }},HIGGSFIELD_API_KEY_SECRET=${{ secrets.HIGGSFIELD_API_KEY_SECRET }},SHOPIFY_CLIENT_ID=${{ secrets.SHOPIFY_CLIENT_ID }},SHOPIFY_CLIENT_SECRET=${{ secrets.SHOPIFY_CLIENT_SECRET }},SHOPIFY_ADMIN_TOKEN=${{ secrets.SHOPIFY_ADMIN_TOKEN }},SHOPIFY_STORE_DOMAIN=lngndny.myshopify.com,KLAVIYO_API_KEY=${{ secrets.KLAVIYO_API_KEY }},NVIDIA_API_KEY=${{ secrets.NVIDIA_API_KEY }}" \
            --quiet

          echo "✅ Scalar deploy done"

      # ── Step 2: Inject JSON secrets via Cloud Run REST API ──
      - name: Inject JSON secrets
        env:
          GCP_SA_KEY_JSON: ${{ secrets.GCP_SA_KEY }}
          GSC_TOKEN_JSON:  ${{ secrets.GSC_TOKEN_JSON }}
          PROJECT:         ${{ secrets.GCP_PROJECT_ID }}
          REGION:          ${{ env.REGION }}
          SERVICE:         ${{ env.SERVICE_NAME }}
        run: |
          pip install pyyaml --quiet

          python3 - <<'PYEOF'
          import json, os, subprocess, sys, yaml

          sa_key    = os.environ['GCP_SA_KEY_JSON']
          gsc_token = os.environ['GSC_TOKEN_JSON']
          project   = os.environ['PROJECT']
          region    = os.environ.get('REGION', 'us-central1')
          service   = os.environ.get('SERVICE', 'gcp-bot')

          # Validate both are valid JSON
          try:
              json.loads(sa_key)
              json.loads(gsc_token)
          except json.JSONDecodeError as e:
              print(f'ERROR: Secret is not valid JSON: {e}')
              sys.exit(1)

          print(f'Fetching current spec for {service} in {region}...')
          r = subprocess.run(
              ['gcloud', 'run', 'services', 'describe', service,
               '--region', region, '--format', 'json'],
              capture_output=True, text=True
          )
          if r.returncode != 0:
              print('describe failed:', r.stderr)
              sys.exit(1)

          svc = json.loads(r.stdout)

          # Remove read-only fields that cause 'replace' to fail
          for field in ('generation', 'resourceVersion', 'selfLink',
                        'uid', 'creationTimestamp'):
              svc.get('metadata', {}).pop(field, None)
          svc.pop('status', None)

          # Patch env list — drop old refs, append fresh plain values
          containers = svc['spec']['template']['spec']['containers']
          envs = [e for e in containers[0].get('env', [])
                  if e.get('name') not in ('GCP_SA_KEY_JSON', 'GSC_TOKEN_JSON')]
          envs.append({'name': 'GCP_SA_KEY_JSON', 'value': sa_key})
          envs.append({'name': 'GSC_TOKEN_JSON',  'value': gsc_token})
          containers[0]['env'] = envs

          # Write patched spec
          with open('/tmp/svc_patched.yaml', 'w') as f:
              yaml.dump(svc, f, default_flow_style=False, allow_unicode=True)

          print('Replacing service with patched spec...')
          r2 = subprocess.run(
              ['gcloud', 'run', 'services', 'replace', '/tmp/svc_patched.yaml',
               '--region', region, '--quiet'],
              text=True
          )
          if r2.returncode == 0:
              print('✅ JSON secrets injected successfully')
          else:
              print('ERROR: services replace failed')
          sys.exit(r2.returncode)
          PYEOF

      # ── Step 3: Ensure public invoker binding ──
      # Requires roles/run.admin on the SA — non-fatal if permission is missing
      - name: Set public invoker IAM
        continue-on-error: true
        run: |
          gcloud run services add-iam-policy-binding ${{ env.SERVICE_NAME }} \
            --region=${{ env.REGION }} \
            --member=allUsers \
            --role=roles/run.invoker \
            --quiet && echo "✅ allUsers invoker binding set" || echo "⚠️ IAM binding skipped — SA needs roles/run.admin"

      # ── Get URL ──
      - name: Get service URL
        id: url
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region ${{ env.REGION }} --format="value(status.url)")
          echo "url=${URL}" >> $GITHUB_OUTPUT
          echo "🌐 ${URL}"

      # ── Health check ──
      - name: Health check
        run: |
          URL="${{ steps.url.outputs.url }}"
          for i in 1 2 3 4 5; do
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" "${URL}/health" || echo "000")
            [ "$STATUS" = "200" ] && echo "✅ Health check passed" && exit 0
            echo "Attempt $i: HTTP ${STATUS} — waiting 10s..."
            sleep 10
          done
          echo "⚠️ Health check inconclusive" && exit 0

      # ── Summary ──
      - name: Summary
        run: |
          SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          {
            echo "### 🚀 Deployment Complete"
            echo "| | |"
            echo "|---|---|"
            echo "| Service | ${{ env.SERVICE_NAME }} |"
            echo "| Image | \`${{ env.IMAGE }}:${SHA}\` |"
            echo "| URL | ${{ steps.url.outputs.url }} |"
            echo "| Commit | \`${{ github.sha }}\` |"
          } >> $GITHUB_STEP_SUMMARY
