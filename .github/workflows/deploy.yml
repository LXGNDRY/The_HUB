# ============================================================
# GCP Bot — GitHub Actions CI/CD Workflow
# Deploy to Google Cloud Run on push to main
# ============================================================

name: 🤖 GCP Bot — Build & Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run in DRY_RUN mode (no real GCP changes)"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

env:
  PROJECT_ID:   ${{ secrets.GCP_PROJECT_ID }}
  SERVICE_NAME: gcp-bot
  REGION:       us-central1
  IMAGE:        gcr.io/${{ secrets.GCP_PROJECT_ID }}/gcp-bot

jobs:
  # ─────────────────────────────────────────
  # JOB 1: Lint & Test
  # ─────────────────────────────────────────
  test:
    name: 🧪 Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt flake8 pytest

      - name: Lint
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

      - name: Test
        run: |
          [ -d tests ] && pytest tests/ -v --tb=short || echo "No tests/ — skipping."

  # ─────────────────────────────────────────
  # JOB 2: Build & Push Docker Image
  # ─────────────────────────────────────────
  build:
    name: 🐳 Build & Push Image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - run: gcloud auth configure-docker --quiet

      - name: Build & Push
        run: |
          SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          docker build \
            --tag "${{ env.IMAGE }}:${SHA}" \
            --tag "${{ env.IMAGE }}:latest" \
            --label "git-commit=${{ github.sha }}" .
          docker push "${{ env.IMAGE }}:${SHA}"
          docker push "${{ env.IMAGE }}:latest"
          echo "✅ Pushed ${{ env.IMAGE }}:${SHA}"

  # ─────────────────────────────────────────
  # JOB 3: Deploy to Cloud Run
  # Scalar env vars via --set-env-vars.
  # JSON secrets (contain commas) injected via a Python-generated
  # Cloud Run YAML spec — values are plain YAML strings, zero parsing.
  # ─────────────────────────────────────────
  deploy:
    name: 🚀 Deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Deploy
        env:
          GCP_PROJECT_ID:      ${{ secrets.GCP_PROJECT_ID }}
          DASHBOARD_API_KEY:   ${{ secrets.DASHBOARD_API_KEY }}
          GA4_PROPERTY_ID:     ${{ secrets.GA4_PROPERTY_ID }}
          GOOGLE_API_KEY:      ${{ secrets.GOOGLE_API_KEY }}
          BUDGET_THRESHOLD:    ${{ secrets.BUDGET_THRESHOLD }}
          IDLE_CPU_THRESHOLD:  ${{ secrets.IDLE_CPU_THRESHOLD }}
          QUOTA_ALERT_PERCENT: ${{ secrets.QUOTA_ALERT_PERCENT }}
          DRY_RUN:             ${{ github.event.inputs.dry_run || 'false' }}
          GCP_SA_KEY_JSON:     ${{ secrets.GCP_SA_KEY }}
          GSC_TOKEN_JSON:      ${{ secrets.GSC_TOKEN_JSON }}
        run: |
          SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          IMAGE_TAG="${{ env.IMAGE }}:${SHA}"
          echo "Deploying: ${IMAGE_TAG}"

          # Step 1 — deploy with scalar env vars (no JSON, no escaping issues)
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image "${IMAGE_TAG}" \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 1 \
            --max-instances 3 \
            --port 8080 \
            --set-env-vars "GCP_PROJECT_ID=${GCP_PROJECT_ID}" \
            --set-env-vars "DASHBOARD_API_KEY=${DASHBOARD_API_KEY}" \
            --set-env-vars "GA4_PROPERTY_ID=${GA4_PROPERTY_ID}" \
            --set-env-vars "GOOGLE_API_KEY=${GOOGLE_API_KEY}" \
            --set-env-vars "BUDGET_THRESHOLD=${BUDGET_THRESHOLD}" \
            --set-env-vars "IDLE_CPU_THRESHOLD=${IDLE_CPU_THRESHOLD}" \
            --set-env-vars "QUOTA_ALERT_PERCENT=${QUOTA_ALERT_PERCENT}" \
            --set-env-vars "DRY_RUN=${DRY_RUN}" \
            --quiet

          echo "✅ Base deploy done — now setting JSON secrets..."

          # Step 2 — strip any stale Secret Manager refs left by previous broken deploys,
          # then write JSON values directly via a Cloud Run YAML patch.
          # We export env to a file so Python can read the full JSON strings safely.
          printenv GCP_SA_KEY_JSON > /tmp/sa_key.txt
          printenv GSC_TOKEN_JSON  > /tmp/gsc_token.txt

          python3 - <<'PYEOF'
          import subprocess, sys, yaml, json

          region  = 'us-central1'
          service = 'gcp-bot'

          # Read JSON secrets from files written by shell above
          sa_key    = open('/tmp/sa_key.txt').read().strip()
          gsc_token = open('/tmp/gsc_token.txt').read().strip()

          # First: remove any stale secret-ref env vars from previous broken deploy
          subprocess.run([
              'gcloud', 'run', 'services', 'update', service,
              '--region', region,
              '--remove-env-vars', 'GCP_SA_KEY_JSON,GSC_TOKEN_JSON',
              '--quiet'
          ], capture_output=True)
          print('Cleared stale secret refs')

          # Second: fetch current service YAML, inject env vars, replace
          r = subprocess.run([
              'gcloud', 'run', 'services', 'describe', service,
              '--region', region,
              '--format', 'yaml'
          ], capture_output=True, text=True)
          if r.returncode != 0:
              print('describe failed:', r.stderr)
              sys.exit(1)

          svc = yaml.safe_load(r.stdout)

          # Get existing env vars, remove any old refs to these two keys
          containers = svc['spec']['template']['spec']['containers']
          existing = containers[0].get('env', [])
          existing = [e for e in existing
                      if e.get('name') not in ('GCP_SA_KEY_JSON', 'GSC_TOKEN_JSON')]

          # Append the two JSON secrets as plain value entries
          existing.append({'name': 'GCP_SA_KEY_JSON', 'value': sa_key})
          existing.append({'name': 'GSC_TOKEN_JSON',  'value': gsc_token})
          containers[0]['env'] = existing

          # Strip read-only fields that gcloud rejects on replace
          for key in ('status', 'generation', 'resourceVersion',
                      'selfLink', 'uid', 'creationTimestamp'):
              svc.get('metadata', {}).pop(key, None)
              svc.get('spec', {}).get('template', {}).get('metadata', {}).pop(key, None)

          with open('/tmp/svc_patched.yaml', 'w') as f:
              yaml.dump(svc, f, default_flow_style=False, allow_unicode=True)

          r2 = subprocess.run([
              'gcloud', 'run', 'services', 'replace', '/tmp/svc_patched.yaml',
              '--region', region, '--quiet'
          ], text=True)
          if r2.returncode != 0:
              sys.exit(r2.returncode)

          print('✅ JSON secrets set via service replace')
          PYEOF

      - name: Get service URL
        id: url
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region ${{ env.REGION }} --format="value(status.url)")
          echo "url=${URL}" >> $GITHUB_OUTPUT
          echo "🌐 ${URL}"

      - name: Health check
        run: |
          URL="${{ steps.url.outputs.url }}"
          for i in 1 2 3 4 5; do
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" "${URL}/health" || echo "000")
            [ "$STATUS" = "200" ] && echo "✅ Health check passed (HTTP 200)" && exit 0
            echo "Attempt $i: HTTP ${STATUS} — waiting 10s..."
            sleep 10
          done
          echo "⚠️ Health check inconclusive"
          exit 0

      - name: Summary
        run: |
          SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          {
            echo "### 🚀 Deployment Complete"
            echo "| | |"
            echo "|---|---|"
            echo "| Service | ${{ env.SERVICE_NAME }} |"
            echo "| Image | \`${{ env.IMAGE }}:${SHA}\` |"
            echo "| URL | ${{ steps.url.outputs.url }} |"
            echo "| Commit | \`${{ github.sha }}\` |"
          } >> $GITHUB_STEP_SUMMARY
