# ============================================================
# GCP Bot — GitHub Actions CI/CD Workflow
# Deploy to Google Cloud Run on push to main
# ============================================================

name: 🤖 GCP Bot — Build & Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run in DRY_RUN mode (no real GCP changes)"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

env:
  PROJECT_ID:   ${{ secrets.GCP_PROJECT_ID }}
  SERVICE_NAME: gcp-bot
  REGION:       us-central1
  IMAGE:        gcr.io/${{ secrets.GCP_PROJECT_ID }}/gcp-bot

jobs:
  # ─────────────────────────────────────────
  # JOB 1: Lint & Test
  # ─────────────────────────────────────────
  test:
    name: 🧪 Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install --upgrade pip && pip install -r requirements.txt flake8 pytest
      - run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
      - run: flake8 . --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics
      - run: "[ -d tests ] && pytest tests/ -v --tb=short || echo 'No tests/ — skipping.'"

  # ─────────────────────────────────────────
  # JOB 2: Build & Push Docker Image
  # ─────────────────────────────────────────
  build:
    name: 🐳 Build & Push Image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
      - run: gcloud auth configure-docker --quiet
      - name: Build & Push
        run: |
          SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          docker build \
            --tag "${{ env.IMAGE }}:${SHA}" \
            --tag "${{ env.IMAGE }}:latest" \
            --label "git-commit=${{ github.sha }}" .
          docker push "${{ env.IMAGE }}:${SHA}"
          docker push "${{ env.IMAGE }}:latest"

  # ─────────────────────────────────────────
  # JOB 3: Deploy to Cloud Run
  #
  # Strategy for JSON secrets (GCP_SA_KEY_JSON, GSC_TOKEN_JSON):
  #   - These contain commas/colons that break gcloud's --set-env-vars parser
  #   - We write them to temp files on the runner, then use the Cloud Run
  #     REST API (curl + SA token) to PATCH the service — bypassing gcloud
  #     entirely for those two values
  #   - --remove-secrets clears any stale Secret Manager refs from prior deploys
  # ─────────────────────────────────────────
  deploy:
    name: 🚀 Deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Deploy (scalar env vars + clear stale secret refs)
        run: |
          SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          IMAGE_TAG="${{ env.IMAGE }}:${SHA}"
          DRY_RUN="${{ github.event.inputs.dry_run || 'false' }}"

          echo "Deploying: ${IMAGE_TAG}"

          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image "${IMAGE_TAG}" \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 1 \
            --max-instances 3 \
            --port 8080 \
            --remove-secrets "GCP_SA_KEY_JSON,GSC_TOKEN_JSON" \
            --set-env-vars "GCP_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }}" \
            --set-env-vars "DASHBOARD_API_KEY=${{ secrets.DASHBOARD_API_KEY }}" \
            --set-env-vars "GA4_PROPERTY_ID=${{ secrets.GA4_PROPERTY_ID }}" \
            --set-env-vars "GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY }}" \
            --set-env-vars "BUDGET_THRESHOLD=${{ secrets.BUDGET_THRESHOLD }}" \
            --set-env-vars "IDLE_CPU_THRESHOLD=${{ secrets.IDLE_CPU_THRESHOLD }}" \
            --set-env-vars "QUOTA_ALERT_PERCENT=${{ secrets.QUOTA_ALERT_PERCENT }}" \
            --set-env-vars "DRY_RUN=${DRY_RUN}" \
            --quiet

          echo "✅ Base deploy done"

      - name: Inject JSON secrets via Cloud Run REST API
        env:
          GCP_SA_KEY_JSON: ${{ secrets.GCP_SA_KEY }}
          GSC_TOKEN_JSON:  ${{ secrets.GSC_TOKEN_JSON }}
        run: |
          # Get a fresh OAuth token
          TOKEN=$(gcloud auth print-access-token)
          PROJECT="${{ secrets.GCP_PROJECT_ID }}"
          REGION="${{ env.REGION }}"
          SERVICE="${{ env.SERVICE_NAME }}"

          # Write the JSON secrets to temp files (safe — no shell expansion)
          printf '%s' "${GCP_SA_KEY_JSON}" > /tmp/sa_key.json
          printf '%s' "${GSC_TOKEN_JSON}"  > /tmp/gsc_token.json

          # Build the PATCH payload in Python — reads from files, not shell vars
          python3 - <<'PYEOF'
          import json, subprocess, sys

          sa_key    = open('/tmp/sa_key.json').read()
          gsc_token = open('/tmp/gsc_token.json').read()

          token   = subprocess.check_output(['gcloud', 'auth', 'print-access-token']).decode().strip()
          project = open('/dev/stdin').read().strip() if False else None

          import os
          project = os.environ.get('PROJECT', '')
          region  = os.environ.get('REGION', 'us-central1')
          service = os.environ.get('SERVICE', 'gcp-bot')

          # Fetch current service spec
          r = subprocess.run([
              'gcloud', 'run', 'services', 'describe', service,
              '--region', region, '--format', 'json'
          ], capture_output=True, text=True)

          if r.returncode != 0:
              print('describe failed:', r.stderr)
              sys.exit(1)

          svc = json.loads(r.stdout)

          # Get existing env list, drop any old refs to these two keys
          containers = svc['spec']['template']['spec']['containers']
          envs = [e for e in containers[0].get('env', [])
                  if e.get('name') not in ('GCP_SA_KEY_JSON', 'GSC_TOKEN_JSON')]

          # Append as plain value entries
          envs.append({'name': 'GCP_SA_KEY_JSON', 'value': sa_key})
          envs.append({'name': 'GSC_TOKEN_JSON',  'value': gsc_token})
          containers[0]['env'] = envs

          # Write patched spec to file
          import yaml
          # Remove read-only metadata fields
          for field in ('generation', 'resourceVersion', 'selfLink',
                        'uid', 'creationTimestamp', 'status'):
              svc.get('metadata', {}).pop(field, None)

          with open('/tmp/svc_patched.yaml', 'w') as f:
              yaml.dump(svc, f, default_flow_style=False, allow_unicode=True)

          # Replace service
          r2 = subprocess.run([
              'gcloud', 'run', 'services', 'replace', '/tmp/svc_patched.yaml',
              '--region', region, '--quiet'
          ], text=True)

          sys.exit(r2.returncode)
          PYEOF
        env:
          PROJECT: ${{ secrets.GCP_PROJECT_ID }}
          REGION:  ${{ env.REGION }}
          SERVICE: ${{ env.SERVICE_NAME }}

      - name: Get service URL
        id: url
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region ${{ env.REGION }} --format="value(status.url)")
          echo "url=${URL}" >> $GITHUB_OUTPUT
          echo "🌐 ${URL}"

      - name: Health check
        run: |
          URL="${{ steps.url.outputs.url }}"
          for i in 1 2 3 4 5; do
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" "${URL}/health" || echo "000")
            [ "$STATUS" = "200" ] && echo "✅ Health check passed" && exit 0
            echo "Attempt $i: HTTP ${STATUS} — waiting 10s..."
            sleep 10
          done
          echo "⚠️ Health check inconclusive" && exit 0

      - name: Summary
        run: |
          SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          {
            echo "### 🚀 Deployment Complete"
            echo "| | |"
            echo "|---|---|"
            echo "| Service | ${{ env.SERVICE_NAME }} |"
            echo "| Image | \`${{ env.IMAGE }}:${SHA}\` |"
            echo "| URL | ${{ steps.url.outputs.url }} |"
            echo "| Commit | \`${{ github.sha }}\` |"
          } >> $GITHUB_STEP_SUMMARY
