# ============================================================
# GCP Bot — GitHub Actions CI/CD Workflow
# Deploy to Google Cloud Run on push to main
# Manual trigger available via workflow_dispatch
# ============================================================

name: 🤖 GCP Bot — Build & Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run in DRY_RUN mode (no real GCP changes)"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  SERVICE_NAME: gcp-bot
  REGION: us-central1
  IMAGE: gcr.io/${{ secrets.GCP_PROJECT_ID }}/gcp-bot

jobs:
  # ─────────────────────────────────────────
  # JOB 1: Lint & Test
  # ─────────────────────────────────────────
  test:
    name: 🧪 Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt flake8 pytest

      - name: Lint
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

      - name: Test
        run: |
          [ -d tests ] && pytest tests/ -v --tb=short || echo "No tests/ — skipping."

  # ─────────────────────────────────────────
  # JOB 2: Build & Push Docker Image
  # ─────────────────────────────────────────
  build:
    name: 🐳 Build & Push Image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - run: gcloud auth configure-docker --quiet

      - name: Build & Push
        run: |
          SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          docker build \
            --tag "${{ env.IMAGE }}:${SHA}" \
            --tag "${{ env.IMAGE }}:latest" \
            --label "git-commit=${{ github.sha }}" .
          docker push "${{ env.IMAGE }}:${SHA}"
          docker push "${{ env.IMAGE }}:latest"

  # ─────────────────────────────────────────
  # JOB 3: Deploy to Cloud Run
  # Uses `gcloud run services replace` with a full YAML service spec.
  # Env var values are plain YAML strings — no gcloud dict-arg parser,
  # no shell escaping — JSON secrets are safe.
  # ─────────────────────────────────────────
  deploy:
    name: 🚀 Deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Build service YAML and deploy
        env:
          GCP_PROJECT_ID:      ${{ secrets.GCP_PROJECT_ID }}
          DASHBOARD_API_KEY:   ${{ secrets.DASHBOARD_API_KEY }}
          GA4_PROPERTY_ID:     ${{ secrets.GA4_PROPERTY_ID }}
          GOOGLE_API_KEY:      ${{ secrets.GOOGLE_API_KEY }}
          BUDGET_THRESHOLD:    ${{ secrets.BUDGET_THRESHOLD }}
          IDLE_CPU_THRESHOLD:  ${{ secrets.IDLE_CPU_THRESHOLD }}
          QUOTA_ALERT_PERCENT: ${{ secrets.QUOTA_ALERT_PERCENT }}
          DRY_RUN:             ${{ github.event.inputs.dry_run || 'false' }}
          GCP_SA_KEY_JSON:     ${{ secrets.GCP_SA_KEY }}
          GSC_TOKEN_JSON:      ${{ secrets.GSC_TOKEN_JSON }}
        run: |
          SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          IMAGE="${{ env.IMAGE }}:${SHA}"

          # Python writes the YAML service spec — env values are Python strings,
          # PyYAML serialises them as quoted YAML scalars, bypassing gcloud entirely.
          python3 - <<'PYEOF'
          import os, yaml, subprocess, sys

          project  = os.environ["GCP_PROJECT_ID"]
          image    = os.environ["IMAGE"]
          region   = "us-central1"
          service  = "gcp-bot"

          env_vars = [
            {"name": "GCP_PROJECT_ID",      "value": os.environ["GCP_PROJECT_ID"]},
            {"name": "DASHBOARD_API_KEY",   "value": os.environ["DASHBOARD_API_KEY"]},
            {"name": "GA4_PROPERTY_ID",     "value": os.environ["GA4_PROPERTY_ID"]},
            {"name": "GOOGLE_API_KEY",      "value": os.environ["GOOGLE_API_KEY"]},
            {"name": "BUDGET_THRESHOLD",    "value": os.environ["BUDGET_THRESHOLD"]},
            {"name": "IDLE_CPU_THRESHOLD",  "value": os.environ["IDLE_CPU_THRESHOLD"]},
            {"name": "QUOTA_ALERT_PERCENT", "value": os.environ["QUOTA_ALERT_PERCENT"]},
            {"name": "DRY_RUN",             "value": os.environ["DRY_RUN"]},
            {"name": "GCP_SA_KEY_JSON",     "value": os.environ["GCP_SA_KEY_JSON"]},
            {"name": "GSC_TOKEN_JSON",      "value": os.environ["GSC_TOKEN_JSON"]},
          ]

          svc = {
            "apiVersion": "serving.knative.dev/v1",
            "kind": "Service",
            "metadata": {
              "name": service,
              "namespace": project,
              "annotations": {
                "run.googleapis.com/ingress": "all",
              },
            },
            "spec": {
              "template": {
                "metadata": {
                  "annotations": {
                    "autoscaling.knative.dev/minScale": "1",
                    "autoscaling.knative.dev/maxScale": "3",
                  }
                },
                "spec": {
                  "containerConcurrency": 80,
                  "containers": [{
                    "image": image,
                    "ports": [{"containerPort": 8080}],
                    "resources": {
                      "limits": {"cpu": "1000m", "memory": "512Mi"}
                    },
                    "env": env_vars,
                  }]
                }
              },
              "traffic": [{"percent": 100, "latestRevision": True}]
            }
          }

          with open("/tmp/service.yaml", "w") as f:
            yaml.dump(svc, f, default_flow_style=False, allow_unicode=True)

          print("Service YAML written — deploying...")
          r = subprocess.run(
            ["gcloud", "run", "services", "replace", "/tmp/service.yaml",
             "--region", region, "--quiet"],
            text=True
          )
          if r.returncode != 0:
            sys.exit(r.returncode)

          # Allow unauthenticated (public) access
          subprocess.run([
            "gcloud", "run", "services", "add-iam-policy-binding", service,
            "--region", region,
            "--member", "allUsers",
            "--role", "roles/run.invoker",
            "--quiet"
          ], text=True)

          print("✅ Deploy complete")
          PYEOF
        env:
          IMAGE: gcr.io/${{ secrets.GCP_PROJECT_ID }}/gcp-bot

      - name: Get service URL
        id: url
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region ${{ env.REGION }} --format="value(status.url)")
          echo "url=${URL}" >> $GITHUB_OUTPUT
          echo "🌐 ${URL}"

      - name: Health check
        run: |
          URL="${{ steps.url.outputs.url }}"
          for i in 1 2 3 4 5; do
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" "${URL}/health" || echo "000")
            [ "$STATUS" = "200" ] && echo "✅ Health check passed" && exit 0
            echo "Attempt $i: HTTP ${STATUS} — waiting 10s..."
            sleep 10
          done
          echo "⚠️ Health check inconclusive — check Cloud Run console"
          exit 0

      - name: Summary
        run: |
          SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          {
            echo "### 🚀 Deployment Complete"
            echo "| | |"
            echo "|---|---|"
            echo "| Service | ${{ env.SERVICE_NAME }} |"
            echo "| Image | \`${{ env.IMAGE }}:${SHA}\` |"
            echo "| URL | ${{ steps.url.outputs.url }} |"
            echo "| Commit | \`${{ github.sha }}\` |"
          } >> $GITHUB_STEP_SUMMARY
