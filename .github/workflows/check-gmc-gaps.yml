name: Check GMC Coverage Gaps
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install google-auth google-api-python-client -q
      - run: python scripts/check_gmc_gaps.py
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
