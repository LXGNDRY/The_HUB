name: Klaviyo — Update Welcome Template

on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests

      - name: Patch CODE templates + create replacements for DND
        env:
          KLAVIYO_API_KEY: ${{ secrets.KLAVIYO_API_KEY }}
          KLAVIYO_COMPUTER_KEY: ${{ secrets.KLAVIYO_COMPUTER_KEY }}
        run: |
          python3 - <<'PYEOF'
          import os, requests, time

          # MCP key — owns TGepj9, SyfwwC, RVetTZ, T6DiMR
          mcp_key = os.environ["KLAVIYO_API_KEY"]
          # Computer/Full Access key — can create new templates + swap
          full_key = os.environ.get("KLAVIYO_COMPUTER_KEY", mcp_key)

          BASE = "https://a.klaviyo.com/api"

          def headers(key):
              return {
                  "Authorization": f"Klaviyo-API-Key {key}",
                  "revision": "2024-10-15",
                  "Content-Type": "application/json",
                  "Accept": "application/json",
              }

          # CODE templates — patch directly with MCP key
          CODE_TEMPLATES = [
              ("TGepj9", "klaviyo_templates/v2/lb_welcome_series.html",        "LB v2 — Welcome Series"),
              ("SyfwwC", "klaviyo_templates/v2/lb_shipping_confirmation.html", "LB v2 — Shipping Confirmation"),
              ("RVetTZ", "klaviyo_templates/v2/lb_out_for_delivery.html",      "LB v2 — Out for Delivery"),
              ("T6DiMR", "klaviyo_templates/v2/lb_delivered_review.html",      "LB v2 — Delivered + Review"),
          ]

          print("=== Patching CODE templates with MCP key ===")
          for tmpl_id, html_path, name in CODE_TEMPLATES:
              with open(html_path) as f:
                  html = f.read()
              body = {"data": {"type": "template", "id": tmpl_id, "attributes": {"name": name, "html": html}}}
              r = requests.patch(f"{BASE}/templates/{tmpl_id}/", headers=headers(mcp_key), json=body, timeout=30)
              if r.ok:
                  print(f"  ✅ {name} ({tmpl_id})")
              else:
                  print(f"  ❌ {name} ({tmpl_id}) — {r.status_code}: {r.text[:150]}")
              time.sleep(0.5)

          PYEOF
