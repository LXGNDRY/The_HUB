name: Klaviyo — Update Welcome Template

on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: List all templates and find flow-linked ones
        env:
          KLAVIYO_API_KEY: ${{ secrets.KLAVIYO_API_KEY }}
        run: |
          python3 - <<'PYEOF'
          import os, requests, time

          key = os.environ["KLAVIYO_API_KEY"]
          headers = {
              "Authorization": f"Klaviyo-API-Key {key}",
              "revision": "2024-10-15",
              "Accept": "application/json",
          }

          # Paginate through all templates
          url = "https://a.klaviyo.com/api/templates/?sort=-updated&page[size]=10&fields[template]=id,name,editor_type,updated"
          all_templates = []
          while url:
              r = requests.get(url, headers=headers, timeout=30)
              if not r.ok:
                  print(f"ERROR {r.status_code}: {r.text[:300]}")
                  break
              data = r.json()
              all_templates.extend(data.get("data", []))
              url = data.get("links", {}).get("next")
              time.sleep(0.3)

          print(f"Total templates: {len(all_templates)}")
          for t in all_templates:
              a = t["attributes"]
              print(f"  {t['id']} | {a['editor_type']:20s} | {a['updated'][:19]} | {a['name']}")

          # Also check: can we PATCH a known-existing template?
          # Try to GET and then PATCH TGepj9
          test_id = "TGepj9"
          gr = requests.get(f"https://a.klaviyo.com/api/templates/{test_id}/?fields[template]=id,name", headers=headers)
          print(f"\nGET {test_id}: {gr.status_code}")
          if gr.ok:
              print(f"  Found: {gr.json()['data']['attributes']['name']}")
              # Try PATCH
              patch_headers = {**headers, "Content-Type": "application/json"}
              pr = requests.patch(
                  f"https://a.klaviyo.com/api/templates/{test_id}/",
                  headers=patch_headers,
                  json={"data": {"type": "template", "id": test_id, "attributes": {"name": "LB v2 — Welcome Series"}}},
                  timeout=30
              )
              print(f"PATCH {test_id}: {pr.status_code} {pr.text[:200]}")
          PYEOF
