name: Klaviyo — Update Welcome Template

on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: List all templates and find flow-linked ones
        env:
          KLAVIYO_API_KEY: ${{ secrets.KLAVIYO_API_KEY }}
        run: |
          python3 - <<'PYEOF'
          import os, requests, time

          key = os.environ["KLAVIYO_API_KEY"]
          headers = {
              "Authorization": f"Klaviyo-API-Key {key}",
              "revision": "2024-10-15",
              "Accept": "application/json",
          }

          # List all templates, sorted by most recently updated
          url = "https://a.klaviyo.com/api/templates/?sort=-updated&page[size]=100&fields[template]=id,name,editor_type,updated"
          r = requests.get(url, headers=headers, timeout=30)
          print(f"List templates: {r.status_code}")
          if r.ok:
              templates = r.json().get("data", [])
              print(f"Total: {len(templates)}")
              for t in templates:
                  a = t["attributes"]
                  print(f"  {t['id']} | {a['editor_type']:20s} | {a['updated'][:19]} | {a['name']}")
          else:
              print(r.text[:500])
          PYEOF
