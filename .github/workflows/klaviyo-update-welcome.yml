name: Klaviyo — Update Welcome Template

on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Update all flow templates with v2 HTML
        env:
          KLAVIYO_API_KEY: ${{ secrets.KLAVIYO_API_KEY }}
        run: |
          python3 - <<'PYEOF'
          import os, requests, time

          key = os.environ["KLAVIYO_API_KEY"]
          base_headers = {
              "Authorization": f"Klaviyo-API-Key {key}",
              "revision": "2024-10-15",
              "Accept": "application/json",
          }
          patch_headers = {**base_headers, "Content-Type": "application/json"}

          # These are the ACTUAL flow-linked template IDs (confirmed from flow-actions audit)
          # SUy9ps = Welcome Series, X7W7u7 = Thank You, SkAgJT = Abandoned Bag 1
          # S4Sg2P = Browse Abandonment, SyfwwC = Shipping, RVetTZ = Out for Delivery, T6DiMR = Delivered
          TEMPLATES = [
              ("SUy9ps", "klaviyo_templates/v2/lb_welcome_series.html",        "LB v2 — Welcome Series"),
              ("XfxXxj", "klaviyo_templates/v2/lb_customer_thank_you.html",    "LB v2 — Customer Thank You"),
              ("TMdH2N", "klaviyo_templates/v2/lb_abandoned_bag_1.html",       "LB v2 — Abandoned Bag 1"),
              ("XtVUCP", "klaviyo_templates/v2/lb_browse_abandonment.html",    "LB v2 — Browse Abandonment"),
              ("UKGVLB", "klaviyo_templates/v2/lb_shipping_confirmation.html", "LB v2 — Shipping Confirmation"),
              ("XZsrmD", "klaviyo_templates/v2/lb_out_for_delivery.html",      "LB v2 — Out for Delivery"),
              ("WsUiTk", "klaviyo_templates/v2/lb_delivered_review.html",      "LB v2 — Delivered + Review"),
          ]

          for tmpl_id, html_path, name in TEMPLATES:
              # First verify it's accessible
              gr = requests.get(f"https://a.klaviyo.com/api/templates/{tmpl_id}/?fields[template]=id,name,editor_type", headers=base_headers)
              if gr.ok:
                  attr = gr.json()["data"]["attributes"]
                  print(f"  Found: {tmpl_id} | {attr['editor_type']} | {attr['name']}")
              else:
                  print(f"  ❌ GET {tmpl_id} failed: {gr.status_code}")
                  continue

              with open(html_path) as f:
                  html = f.read()

              body = {
                  "data": {
                      "type": "template",
                      "id": tmpl_id,
                      "attributes": {"name": name, "html": html}
                  }
              }

              r = requests.patch(
                  f"https://a.klaviyo.com/api/templates/{tmpl_id}/",
                  headers=patch_headers,
                  json=body,
                  timeout=30
              )

              if r.ok:
                  print(f"✅ {name} ({tmpl_id}) updated")
              else:
                  print(f"❌ {name} ({tmpl_id}) — {r.status_code}: {r.text[:200]}")

              time.sleep(0.5)

          PYEOF
