name: Enterprise Quality Gate

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: enterprise-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-quality:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r app/requirements.txt pytest pytest-cov ruff mypy bandit pip-audit
      - run: test -d tests
      - run: ruff check app/core app/integrations app/jobs tests
      - run: bandit -q -r app/core app/integrations app/jobs -x tests
      - run: pip-audit --strict
      - run: >-
          pytest -q tests/test_security.py tests/test_identity.py tests/test_job_contracts.py
          --cov=app.core.security --cov=app.core.identity
          --cov=app.jobs.contracts --cov=app.jobs.registry --cov=app.jobs.policy
          --cov-report=term-missing --cov-fail-under=70

  workflow-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker://rhysd/actionlint:latest
        with:
          args: .github/workflows/enterprise-ci.yml .github/workflows/deploy.yml .github/workflows/hub-backend-deploy.yml

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        dockerfile: [Dockerfile, app/Dockerfile]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
