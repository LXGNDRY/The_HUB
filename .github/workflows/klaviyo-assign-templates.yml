name: Klaviyo — Assign LB Templates to Flows

on:
  workflow_dispatch:

jobs:
  assign-templates:
    name: Wire v2 templates to flow messages
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests klaviyo-api

      - name: Assign v2 templates to flow messages
        env:
          KLAVIYO_API_KEY: ${{ secrets.KLAVIYO_API_KEY }}
        run: |
          python3 - <<'PYEOF'
          import sys, os, requests, json

          key = os.environ["KLAVIYO_API_KEY"]
          headers = {
              "Authorization": f"Klaviyo-API-Key {key}",
              "revision": "2024-10-15",
              "Content-Type": "application/json",
              "Accept": "application/json",
          }

          # v2 template IDs → flow message IDs
          V2_MAP = {
              "UjfrVL": ("Email Welcome Series",      "QNn86Y"),
              "VjwdXC": ("Customer Thank You",         "UmcSXr"),
              "YkSXSX": ("Abandoned Bag (Email 1)",    "WgSh2b"),
              "Y5aXaT": ("Browse Abandonment",         "U5TmP6"),
              "YyydEG": ("Shipping Confirmation",      "RaETBC"),
              "XVxb45": ("Out for Delivery",           "YnYFQr"),
              "Ridrhn": ("Delivered + Review",         "XNzTqF"),
          }

          results = []
          errors  = []

          for message_id, (flow_name, template_id) in V2_MAP.items():
              body = {
                  "data": {
                      "type": "template",
                      "id": template_id,
                  }
              }
              url = f"https://a.klaviyo.com/api/flow-messages/{message_id}/relationships/template"
              r = requests.patch(url, headers=headers, json=body, timeout=30)
              if r.ok or r.status_code == 204:
                  results.append({"flow_name": flow_name, "message_id": message_id, "template_id": template_id, "status": "assigned"})
                  print(f"✅  {flow_name} ({message_id}) → {template_id}")
              else:
                  errors.append({"flow_name": flow_name, "message_id": message_id, "template_id": template_id, "status": r.status_code, "error": r.text[:300]})
                  print(f"❌  {flow_name} ({message_id}) → {r.status_code}: {r.text[:200]}")

          print(f"\nDone. ✅ {len(results)} assigned, ❌ {len(errors)} errors.")
          if errors:
              print(json.dumps(errors, indent=2))
              sys.exit(1)
          PYEOF
