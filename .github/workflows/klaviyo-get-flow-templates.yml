name: Klaviyo — Get Flow Message Template IDs

on:
  workflow_dispatch:

jobs:
  get-templates:
    name: Fetch current template IDs from flow messages
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch flow message template IDs
        env:
          KLAVIYO_API_KEY: ${{ secrets.KLAVIYO_API_KEY }}
        run: |
          python3 - <<'PYEOF'
          import os, requests, json

          key = os.environ["KLAVIYO_API_KEY"]
          headers = {
              "Authorization": f"Klaviyo-API-Key {key}",
              "revision": "2024-10-15",
              "Accept": "application/json",
          }

          # Flow IDs to inspect
          FLOWS = {
              "RgxHfC": "Email Welcome Series",
              "RJEsWE": "Customer Thank You",
              "UL3cRZ": "Abandoned Cart",
              "Uujc9V": "Browse Abandonment",
              "WL8kad": "LB — Shipping Confirmation",
              "W97hxA": "LB — Out for Delivery",
              "Vw6eUX": "LB — Delivered + Review",
          }

          for flow_id, flow_name in FLOWS.items():
              # Get all actions in the flow (includes email messages)
              url = f"https://a.klaviyo.com/api/flows/{flow_id}/flow-actions/?fields[flow-action]=id,action_type&page[size]=50"
              r = requests.get(url, headers=headers, timeout=30)
              print(f"\n=== {flow_name} ({flow_id}) ===")
              if not r.ok:
                  print(f"  flow-actions ERROR {r.status_code}: {r.text[:300]}")
                  continue

              actions = r.json().get("data", [])
              for action in actions:
                  action_id = action["id"]
                  action_type = action["attributes"].get("action_type", "")
                  if action_type != "EMAIL":
                      continue
                  # Get the messages for this action
                  msg_url = f"https://a.klaviyo.com/api/flow-actions/{action_id}/flow-messages/?fields[flow-message]=id,name&fields[template]=id,name&include=template&page[size]=50"
                  mr = requests.get(msg_url, headers=headers, timeout=30)
                  if mr.ok:
                      mdata = mr.json()
                      messages = mdata.get("data", [])
                      included = {item["id"]: item for item in mdata.get("included", [])}
                      for msg in messages:
                          msg_id = msg["id"]
                          msg_name = msg["attributes"].get("name", "")
                          tmpl_rel = msg.get("relationships", {}).get("template", {}).get("data")
                          tmpl_id = tmpl_rel.get("id", "NO TEMPLATE") if tmpl_rel else "NO TEMPLATE"
                          tmpl_name = included.get(tmpl_id, {}).get("attributes", {}).get("name", "unknown") if tmpl_id != "NO TEMPLATE" else "none"
                          print(f"  action={action_id} | msg_id={msg_id} | msg_name={msg_name}")
                          print(f"  template_id={tmpl_id} | template_name={tmpl_name}")
                  else:
                      print(f"  messages ERROR {mr.status_code}: {mr.text[:200]}")

          PYEOF
