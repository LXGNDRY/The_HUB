name: Klaviyo — Get Flow Message Template IDs

on:
  workflow_dispatch:

jobs:
  get-templates:
    name: Fetch current template IDs from flow messages
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch flow message template IDs
        env:
          KLAVIYO_API_KEY: ${{ secrets.KLAVIYO_API_KEY }}
        run: |
          python3 - <<'PYEOF'
          import os, requests, json, time

          key = os.environ["KLAVIYO_API_KEY"]
          headers = {
              "Authorization": f"Klaviyo-API-Key {key}",
              "revision": "2024-10-15",
              "Accept": "application/json",
          }

          def get(url, retries=3):
              for i in range(retries):
                  r = requests.get(url, headers=headers, timeout=30)
                  if r.status_code == 429:
                      time.sleep(2)
                      continue
                  return r
              return r

          # SEND_EMAIL action IDs discovered from previous run
          # action_id -> (flow_name, flow_id)
          EMAIL_ACTIONS = {
              "85179311": ("Welcome Series Email 1", "RgxHfC"),
              "85179314": ("Welcome Series Email 2", "RgxHfC"),
              "85179316": ("Welcome Series Email 3", "RgxHfC"),
              "85179318": ("Welcome Series Email 4", "RgxHfC"),
              "104758225": ("Welcome Series Email 5", "RgxHfC"),
              "85741302": ("Customer Thank You Email 1", "RJEsWE"),
              "85741885": ("Customer Thank You Email 2", "RJEsWE"),
              "85191760": ("Abandoned Cart Email 1", "UL3cRZ"),
              "85191762": ("Abandoned Cart Email 2", "UL3cRZ"),
              "85192325": ("Abandoned Cart Email 3", "UL3cRZ"),
              "85192565": ("Abandoned Cart Email 4", "UL3cRZ"),
              "85185526": ("Browse Abandonment Email 1", "Uujc9V"),
              "85187073": ("Browse Abandonment Email 2", "Uujc9V"),
              "85187221": ("Browse Abandonment Email 3", "Uujc9V"),
              "85193979": ("Browse Abandonment Email 4", "Uujc9V"),
              "107366125": ("Shipping Confirmation", "WL8kad"),
              "107366126": ("Out for Delivery", "W97hxA"),
              "107366128": ("Delivered + Review", "Vw6eUX"),
          }

          for action_id, (label, flow_id) in EMAIL_ACTIONS.items():
              # Get messages for this action (no include param)
              msg_url = f"https://a.klaviyo.com/api/flow-actions/{action_id}/flow-messages/?fields[flow-message]=id,name&page[size]=10"
              mr = get(msg_url)
              if not mr.ok:
                  print(f"[{label}] action={action_id} messages ERROR {mr.status_code}: {mr.text[:150]}")
                  continue
              messages = mr.json().get("data", [])
              for msg in messages:
                  msg_id = msg["id"]
                  msg_name = msg["attributes"].get("name", "")
                  # Get template relationship separately
                  tmpl_url = f"https://a.klaviyo.com/api/flow-messages/{msg_id}/relationships/template/"
                  tr = get(tmpl_url)
                  if tr.ok:
                      tdata = tr.json().get("data", {})
                      tmpl_id = tdata.get("id", "NO TEMPLATE") if tdata else "NO TEMPLATE"
                  else:
                      tmpl_id = f"ERR {tr.status_code}"
                  print(f"RESULT | {label} | action={action_id} | msg_id={msg_id} | template_id={tmpl_id}")
                  time.sleep(0.3)
              time.sleep(0.5)

          PYEOF
