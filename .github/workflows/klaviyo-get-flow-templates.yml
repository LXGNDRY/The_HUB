name: Klaviyo — Get Flow Message Template IDs

on:
  workflow_dispatch:

jobs:
  get-templates:
    name: Fetch current template IDs from flow messages
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch flow message template IDs
        env:
          KLAVIYO_API_KEY: ${{ secrets.KLAVIYO_API_KEY }}
        run: |
          python3 - <<'PYEOF'
          import os, requests, json

          key = os.environ["KLAVIYO_API_KEY"]
          headers = {
              "Authorization": f"Klaviyo-API-Key {key}",
              "revision": "2024-10-15",
              "Accept": "application/json",
          }

          # Flow IDs to inspect
          FLOWS = {
              "RgxHfC": "Email Welcome Series",
              "RJEsWE": "Customer Thank You",
              "UL3cRZ": "Abandoned Cart",
              "Uujc9V": "Browse Abandonment",
              "WL8kad": "LB — Shipping Confirmation",
              "W97hxA": "LB — Out for Delivery",
              "Vw6eUX": "LB — Delivered + Review",
          }

          for flow_id, flow_name in FLOWS.items():
              # Get flow messages for this flow
              url = f"https://a.klaviyo.com/api/flows/{flow_id}/flow-messages/?fields[flow-message]=id,name,channel&fields[template]=id,name&include=template"
              r = requests.get(url, headers=headers, timeout=30)
              print(f"\n=== {flow_name} ({flow_id}) ===")
              if r.ok:
                  data = r.json()
                  messages = data.get("data", [])
                  included = {item["id"]: item for item in data.get("included", [])}
                  for msg in messages:
                      msg_id = msg["id"]
                      msg_name = msg["attributes"].get("name", "")
                      # Get template relationship
                      tmpl_rel = msg.get("relationships", {}).get("template", {}).get("data", {})
                      tmpl_id = tmpl_rel.get("id", "NO TEMPLATE")
                      tmpl_name = included.get(tmpl_id, {}).get("attributes", {}).get("name", "unknown") if tmpl_id != "NO TEMPLATE" else "none"
                      print(f"  Message: {msg_id} | {msg_name}")
                      print(f"  Template: {tmpl_id} | {tmpl_name}")
              else:
                  print(f"  ERROR {r.status_code}: {r.text[:300]}")

          PYEOF
