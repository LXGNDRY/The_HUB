name: Compliance V2 Automation CI

# Covers the pieces compliance-v2-ci.yml doesn't: the Shopify-wiring modules
# and scripts that drive the (now fully automated, no-human-approval-step)
# audit + write pipeline. Lint + build (import/compile) + test on every
# change to this code.

on:
  pull_request:
    paths:
      - "modules/international_compliance_runner.py"
      - "modules/shopify.py"
      - "scripts/compliance_v2_audit.py"
      - "scripts/compliance_v2_apply.py"
      - "scheduler/jobs.py"
      - "scheduler/engine.py"
      - "app/core/international_compliance/**"
      - "tests/test_international_compliance*_v2.py"
      - ".github/workflows/compliance-v2-automation-ci.yml"
  push:
    branches:
      - "main"
    paths:
      - "modules/international_compliance_runner.py"
      - "modules/shopify.py"
      - "scripts/compliance_v2_audit.py"
      - "scripts/compliance_v2_apply.py"
      - "scheduler/jobs.py"
      - "scheduler/engine.py"
      - "app/core/international_compliance/**"
      - "tests/test_international_compliance*_v2.py"
      - ".github/workflows/compliance-v2-automation-ci.yml"

permissions:
  contents: read

jobs:
  automation-quality-gate:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # ruff pinned: an unpinned install can silently pick up a newer
          # release that enables new default rules, which would flag
          # pre-existing, unrelated legacy code in modules/shopify.py the
          # moment this workflow starts covering it — not this PR's to fix.
          pip install -r app/requirements.txt pytest "ruff==0.15.8" requests

      - name: Lint
        run: |
          ruff check \
            modules/international_compliance_runner.py \
            modules/shopify.py \
            scripts/compliance_v2_audit.py \
            scripts/compliance_v2_apply.py \
            app/core/international_compliance \
            tests/test_international_compliance*_v2.py

      - name: Build (import / compile check)
        run: |
          python -m py_compile \
            modules/international_compliance_runner.py \
            modules/shopify.py \
            scripts/compliance_v2_audit.py \
            scripts/compliance_v2_apply.py \
            scheduler/jobs.py \
            scheduler/engine.py
          python -c "import modules.international_compliance_runner"
          python -c "import modules.shopify"

      - name: Test
        run: pytest -q tests/test_international_compliance*_v2.py
