name: GMC Feed Audit

on:
  workflow_dispatch:

jobs:
  gmc-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install google-auth google-api-python-client
      - name: Run GMC audit
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: python scripts/gmc_audit.py
