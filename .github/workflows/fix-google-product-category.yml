name: Fix Google Product Category Metafield

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview changes without writing to Shopify"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Backfill google_product_category metafield
        env:
          SHOPIFY_STORE_DOMAIN:  ${{ secrets.SHOPIFY_STORE_DOMAIN }}
          SHOPIFY_CLIENT_ID:     ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          SHOPIFY_ADMIN_TOKEN:   ${{ secrets.SHOPIFY_ADMIN_TOKEN }}
          DRY_RUN:               ${{ inputs.dry_run }}
        run: python scripts/fix_google_product_category.py
