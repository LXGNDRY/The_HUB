name: Fix Shopify Country of Origin + HS Codes

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview changes without writing to Shopify"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      force_overwrite:
        description: "Overwrite COO even when already set (use to correct a bad previous run)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Apply country of origin + HS codes
        env:
          SHOPIFY_ADMIN_TOKEN:   ${{ secrets.SHOPIFY_ADMIN_TOKEN }}
          SHOPIFY_CLIENT_ID:     ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          DRY_RUN:               ${{ inputs.dry_run }}
          FORCE_OVERWRITE:       ${{ inputs.force_overwrite }}
        run: python scripts/fix_shopify_country_hs.py
