name: Klaviyo — Push v2 Templates to Flows

on:
  workflow_dispatch:

jobs:
  push-templates:
    name: Replace flow templates with v2 HTML
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Push v2 HTML templates to flows
        env:
          KLAVIYO_API_KEY: ${{ secrets.KLAVIYO_API_KEY }}
        run: |
          python3 - <<'PYEOF'
          import os, requests, json, time

          key = os.environ["KLAVIYO_API_KEY"]
          headers = {
              "Authorization": f"Klaviyo-API-Key {key}",
              "revision": "2024-10-15",
              "Content-Type": "application/json",
              "Accept": "application/json",
          }

          def get(url):
              for _ in range(3):
                  r = requests.get(url, headers=headers, timeout=30)
                  if r.status_code == 429: time.sleep(2); continue
                  return r
              return r

          def patch(url, body):
              for _ in range(3):
                  r = requests.patch(url, headers=headers, json=body, timeout=30)
                  if r.status_code == 429: time.sleep(2); continue
                  return r
              return r

          def post(url, body):
              for _ in range(3):
                  r = requests.post(url, headers=headers, json=body, timeout=30)
                  if r.status_code == 429: time.sleep(2); continue
                  return r
              return r

          BASE = "https://a.klaviyo.com/api"

          # Real flow message IDs -> v2 HTML file -> display name
          TARGETS = [
              ("UjfrVL", "klaviyo_templates/v2/lb_welcome_series.html",        "LB v2 — Welcome Series"),
              ("VjwdXC", "klaviyo_templates/v2/lb_customer_thank_you.html",    "LB v2 — Customer Thank You"),
              ("YkSXSX", "klaviyo_templates/v2/lb_abandoned_bag_1.html",       "LB v2 — Abandoned Bag 1"),
              ("Y5aXaT", "klaviyo_templates/v2/lb_browse_abandonment.html",    "LB v2 — Browse Abandonment"),
              ("YyydEG", "klaviyo_templates/v2/lb_shipping_confirmation.html", "LB v2 — Shipping Confirmation"),
              ("XVxb45", "klaviyo_templates/v2/lb_out_for_delivery.html",      "LB v2 — Out for Delivery"),
              ("Ridrhn", "klaviyo_templates/v2/lb_delivered_review.html",      "LB v2 — Delivered + Review"),
          ]

          results = []

          for msg_id, html_path, name in TARGETS:
              print(f"\n--- {name} (msg={msg_id}) ---")

              # Read HTML
              with open(html_path) as f:
                  html = f.read()

              # Step 1: Check current template type
              tr = get(f"{BASE}/flow-messages/{msg_id}/relationships/template/")
              if not tr.ok:
                  print(f"  ❌ Can't get template relationship: {tr.status_code} {tr.text[:200]}")
                  results.append((name, "FAILED - can't read template rel"))
                  continue

              current_tmpl_id = tr.json().get("data", {}).get("id")
              print(f"  Current template ID: {current_tmpl_id}")

              # Step 2: Check editor type
              if current_tmpl_id:
                  tmpl_r = get(f"{BASE}/templates/{current_tmpl_id}/?fields[template]=id,name,editor_type")
                  if tmpl_r.ok:
                      editor_type = tmpl_r.json()["data"]["attributes"].get("editor_type", "unknown")
                      print(f"  Editor type: {editor_type}")
                  else:
                      editor_type = "unknown"

              # Step 3a: If CODE/USER_DRAGGABLE, update in place
              if editor_type in ("CODE", "USER_DRAGGABLE") and current_tmpl_id:
                  body = {"data": {"type": "template", "id": current_tmpl_id, "attributes": {"name": name, "html": html}}}
                  r = patch(f"{BASE}/templates/{current_tmpl_id}/", body)
                  if r.ok:
                      print(f"  ✅ Updated in place")
                      results.append((name, f"UPDATED in place ({current_tmpl_id})"))
                      time.sleep(0.5)
                      continue
                  else:
                      print(f"  ⚠️  In-place update failed ({r.status_code}), will create new")

              # Step 3b: Create a new CODE template
              create_body = {
                  "data": {
                      "type": "template",
                      "attributes": {
                          "name": name,
                          "editor_type": "CODE",
                          "html": html
                      }
                  }
              }
              cr = post(f"{BASE}/templates/", create_body)
              if not cr.ok:
                  print(f"  ❌ Create failed: {cr.status_code} {cr.text[:300]}")
                  results.append((name, f"FAILED - create {cr.status_code}"))
                  continue

              new_tmpl_id = cr.json()["data"]["id"]
              print(f"  ✅ Created new template: {new_tmpl_id}")

              # Step 4: Assign new template to flow message
              assign_body = {"data": {"type": "template", "id": new_tmpl_id}}
              ar = patch(f"{BASE}/flow-messages/{msg_id}/relationships/template/", assign_body)
              if ar.ok or ar.status_code == 204:
                  print(f"  ✅ Assigned to flow message {msg_id}")
                  results.append((name, f"CREATED+ASSIGNED ({new_tmpl_id})"))
              else:
                  print(f"  ❌ Assign failed: {ar.status_code} {ar.text[:300]}")
                  results.append((name, f"CREATED but assign FAILED ({new_tmpl_id}) - {ar.status_code}"))

              time.sleep(0.8)

          print("\n\n=== SUMMARY ===")
          for name, status in results:
              print(f"  {name}: {status}")

          failed = [r for r in results if "FAILED" in r[1]]
          if failed:
              import sys; sys.exit(1)

          PYEOF
