name: Product Title Cleanup

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (true = preview only, false = write changes)"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run product title cleanup
        env:
          SHOPIFY_ADMIN_TOKEN: ${{ secrets.SHOPIFY_ADMIN_TOKEN }}
        run: |
          DRY_FLAG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_FLAG="--dry-run"
          fi
          python scripts/product_title_cleanup.py $DRY_FLAG
