name: Request GSC Indexing

on:
  workflow_dispatch:

jobs:
  request-indexing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install requests google-auth
      - name: Request indexing for non-indexed URLs
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: python scripts/request_indexing.py
