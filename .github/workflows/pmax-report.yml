name: LXGNDRY PMax — Performance Report

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Number of days to look back (7, 14, 30, 60, 90)"
        required: false
        default: "30"
  schedule:
    # Every Monday at 09:00 CT (14:00 UTC)
    - cron: "0 14 * * 1"

jobs:
  pmax-report:
    name: Pull LXGNDRY Campaign Report
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install google-ads

      - name: Run PMax report
        id: report
        env:
          GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
          GOOGLE_ADS_CLIENT_ID:       ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
          GOOGLE_ADS_CLIENT_SECRET:   ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
          GOOGLE_ADS_REFRESH_TOKEN:   ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
        run: |
          set -o pipefail
          DAYS="${{ github.event.inputs.days || '30' }}"
          echo "## LXGNDRY PMax — Last ${DAYS} Days" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          python -u scripts/pmax_report.py --days "$DAYS" 2>&1 | tee report_output.txt
          cat report_output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lxgndry-pmax-report-${{ github.run_id }}
          path: report_output.txt
          retention-days: 90
