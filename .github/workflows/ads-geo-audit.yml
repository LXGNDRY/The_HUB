name: Google Ads Geo vs Shopify Markets (read-only)

on:
  workflow_dispatch:
  push:
    # TEMPORARY: lets the report run from the PR branch before the workflow exists on main
    branches: [claude/ads-geo-vs-markets]
    paths: [scripts/ads_geo_audit.py]

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install google-ads requests -q
      - name: Compare Ads location targets to Shopify Markets
        env:
          GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
          GOOGLE_ADS_CLIENT_ID: ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
          GOOGLE_ADS_CLIENT_SECRET: ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
          GOOGLE_ADS_REFRESH_TOKEN: ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
          SHOPIFY_ADMIN_TOKEN: ${{ secrets.SHOPIFY_ADMIN_TOKEN }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
        run: python scripts/ads_geo_audit.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ads-geo-audit
          path: outputs/ads_geo_audit.json
          if-no-files-found: ignore
