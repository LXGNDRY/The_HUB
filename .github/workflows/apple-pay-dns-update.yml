name: Apple Pay DNS Update

on:
  workflow_dispatch:

jobs:
  update-dns:
    runs-on: ubuntu-latest
    env:
      PROJECT_ID: idx-lngndny
      LB_IP: 34.160.141.1

    steps:
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: idx-lngndny

      - name: Find DNS zone and current A records
        run: |
          echo "=== All DNS zones ==="
          gcloud dns managed-zones list --project=$PROJECT_ID

          # Get the zone name for legendary-branding.com
          ZONE=$(gcloud dns managed-zones list --project=$PROJECT_ID \
            --filter="dnsName=legendary-branding.com." \
            --format="value(name)" 2>/dev/null)

          if [ -z "$ZONE" ]; then
            # Try fuzzy match
            ZONE=$(gcloud dns managed-zones list --project=$PROJECT_ID \
              --format="value(name)" | grep -i "legendary\|branding" | head -1)
          fi

          if [ -z "$ZONE" ]; then
            ZONE=$(gcloud dns managed-zones list --project=$PROJECT_ID \
              --format="value(name)" | head -1)
          fi

          echo "Using zone: $ZONE"
          echo "ZONE=$ZONE" >> $GITHUB_ENV

          echo ""
          echo "=== Current A records ==="
          gcloud dns record-sets list --zone=$ZONE --project=$PROJECT_ID --type=A

      - name: Update A records to Load Balancer IP
        run: |
          echo "Updating DNS A records to LB IP: $LB_IP"
          echo "Zone: $ZONE"

          # Check current A record for apex domain
          CURRENT_APEX=$(gcloud dns record-sets describe legendary-branding.com. \
            --zone=$ZONE --project=$PROJECT_ID --type=A \
            --format="value(rrdatas[0])" 2>/dev/null || echo "none")

          echo "Current apex A record: $CURRENT_APEX"

          if [ "$CURRENT_APEX" = "$LB_IP" ]; then
            echo "Apex A record already points to LB IP — skipping"
          elif [ "$CURRENT_APEX" = "none" ]; then
            # Create new record
            gcloud dns record-sets create legendary-branding.com. \
              --zone=$ZONE --project=$PROJECT_ID \
              --type=A --ttl=300 \
              --rrdatas=$LB_IP
            echo "Created apex A record"
          else
            # Update existing record
            gcloud dns record-sets update legendary-branding.com. \
              --zone=$ZONE --project=$PROJECT_ID \
              --type=A --ttl=300 \
              --rrdatas=$LB_IP
            echo "Updated apex A record: $CURRENT_APEX -> $LB_IP"
          fi

          # Check www subdomain — it's currently a CNAME to shops.myshopify.com
          # The LB handles www via hostRules, so we need A record not CNAME for www too
          CURRENT_WWW_CNAME=$(gcloud dns record-sets describe www.legendary-branding.com. \
            --zone=$ZONE --project=$PROJECT_ID --type=CNAME \
            --format="value(rrdatas[0])" 2>/dev/null || echo "none")

          CURRENT_WWW_A=$(gcloud dns record-sets describe www.legendary-branding.com. \
            --zone=$ZONE --project=$PROJECT_ID --type=A \
            --format="value(rrdatas[0])" 2>/dev/null || echo "none")

          echo "Current www CNAME: $CURRENT_WWW_CNAME"
          echo "Current www A: $CURRENT_WWW_A"

          if [ "$CURRENT_WWW_CNAME" != "none" ]; then
            # Delete CNAME and replace with A record
            gcloud dns record-sets delete www.legendary-branding.com. \
              --zone=$ZONE --project=$PROJECT_ID --type=CNAME
            echo "Deleted www CNAME"
          fi

          if [ "$CURRENT_WWW_A" = "$LB_IP" ]; then
            echo "www A record already points to LB IP"
          elif [ "$CURRENT_WWW_A" = "none" ]; then
            gcloud dns record-sets create www.legendary-branding.com. \
              --zone=$ZONE --project=$PROJECT_ID \
              --type=A --ttl=300 \
              --rrdatas=$LB_IP
            echo "Created www A record"
          else
            gcloud dns record-sets update www.legendary-branding.com. \
              --zone=$ZONE --project=$PROJECT_ID \
              --type=A --ttl=300 \
              --rrdatas=$LB_IP
            echo "Updated www A record: $CURRENT_WWW_A -> $LB_IP"
          fi

      - name: Verify DNS change
        run: |
          echo "=== Updated A records ==="
          gcloud dns record-sets list --zone=$ZONE --project=$PROJECT_ID --type=A

          echo ""
          echo "================================================================"
          echo "  DNS UPDATE COMPLETE"
          echo "================================================================"
          echo "  legendary-branding.com    A  →  $LB_IP"
          echo "  www.legendary-branding.com A  →  $LB_IP"
          echo ""
          echo "  The Google-managed SSL cert will auto-provision (~15-30 min)"
          echo "  once DNS propagates globally."
          echo ""
          echo "  After ~30 minutes, verify Apple Pay file at:"
          echo "  https://legendary-branding.com/.well-known/apple-developer-merchantid-domain-association"
          echo ""
          echo "  Then go to Razorpay Dashboard → Payment Methods → Apple Pay"
          echo "  and click 'Verify Domains' for both:"
          echo "    legendary-branding.com"
          echo "    www.legendary-branding.com"
          echo "================================================================"
