name: International Compliance V2

on:
  pull_request:
    paths:
      - "app/core/international_compliance/**"
      - "tests/test_international_compliance*_v2.py"
      - ".github/workflows/compliance-v2-ci.yml"
  push:
    branches:
      - "feat/international-compliance-v2"
    paths:
      - "app/core/international_compliance/**"
      - "tests/test_international_compliance*_v2.py"
      - ".github/workflows/compliance-v2-ci.yml"

permissions:
  contents: read

jobs:
  compliance-v2:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r app/requirements.txt pytest ruff
      - run: ruff check app/core/international_compliance tests/test_international_compliance*_v2.py
      - run: pytest -q tests/test_international_compliance*_v2.py
