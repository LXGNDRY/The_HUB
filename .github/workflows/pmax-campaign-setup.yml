name: PMax Campaign Setup — LB Streetwear

on:
  workflow_dispatch:
    inputs:
      daily_budget_usd:
        description: "Daily budget in USD (default: 30)"
        required: false
        default: "30"
      confirm:
        description: "Type CONFIRM to create the campaign"
        required: true

jobs:
  create-pmax-campaign:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Guard — require explicit confirmation
        if: ${{ github.event.inputs.confirm != 'CONFIRM' }}
        run: |
          echo "❌ You must type CONFIRM in the confirm field to run this workflow."
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests google-auth google-auth-httplib2

      - name: Create PMax campaign + asset groups + search themes
        env:
          # Option A: GCP SA key (if SA has been added to Google Ads as a user)
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          # Required regardless of auth method
          GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
          # Option B: Pass a direct OAuth2 access token (if SA auth doesn't work)
          # GOOGLE_ADS_ACCESS_TOKEN: ${{ secrets.GOOGLE_ADS_ACCESS_TOKEN }}
        run: python scripts/pmax_rest_setup.py
