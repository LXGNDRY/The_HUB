name: Dump GMC Shipping Structure

on:
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install google-auth requests -q
      - name: Dump shipping structure (Merchant API v1)
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          python - << 'PYEOF'
          import json, os, sys
          sys.path.insert(0, ".")
          from modules import merchant_api as gmc
          resp = gmc.shipping_settings()
          os.makedirs("outputs", exist_ok=True)
          with open("outputs/gmc_shipping.json", "w") as f:
              json.dump(resp, f, indent=2)
          print(f"Services: {len(resp.get('services', []))}")
          for svc in resp.get("services", []):
              groups = svc.get("rateGroups", [])
              rate = gmc.flat_rate(groups[0]) if groups else None
              print(f"  '{svc.get('serviceName')}' | countries: {svc.get('deliveryCountries', [])} "
                    f"| active: {svc.get('active')} | rate: {rate} {svc.get('currencyCode')}")
          PYEOF
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gmc-shipping-structure
          path: outputs/gmc_shipping.json
