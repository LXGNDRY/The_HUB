name: Fix International Shipping Rates

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run mode (no changes written)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  fix-shipping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run shipping rate fix
        env:
          SHOPIFY_ADMIN_TOKEN: ${{ secrets.SHOPIFY_ADMIN_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: python scripts/fix_international_shipping_rates.py
