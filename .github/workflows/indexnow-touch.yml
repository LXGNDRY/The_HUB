name: IndexNow — Touch Products

on:
  workflow_dispatch:

jobs:
  touch-products:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Touch all unindexed products to trigger IndexNow
        env:
          SHOPIFY_ADMIN_TOKEN: ${{ secrets.SHOPIFY_ADMIN_TOKEN }}
        run: python scripts/touch_products_indexnow.py
