name: Klaviyo — Build All Flows From Scratch

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests

      - name: Build all 7 flows
        env:
          KLAVIYO_API_KEY: ${{ secrets.KLAVIYO_API_KEY }}
        run: |
          python3 - <<'PYEOF'
          import os, requests, json, time

          key = os.environ["KLAVIYO_API_KEY"]
          BASE = "https://a.klaviyo.com/api"
          H = {
              "Authorization": f"Klaviyo-API-Key {key}",
              "revision": "2024-10-15",
              "Content-Type": "application/json",
              "Accept": "application/json",
          }

          # ── Confirmed IDs from discovery run ──────────────────────────────
          M = {
              "placed_order":        "R3JQyK",
              "checkout_started":    "YdsnAF",
              "viewed_product":      "QX7Adm",
              "confirmed_shipment":  "SB3nHb",
              "out_for_delivery":    "UA5kpZ",
              "delivered_shipment":  "XPgh46",
              "subscribed_list":     "Sb4cNY",
          }
          EMAIL_LIST_ID = "RCJT2R"
          V2 = "klaviyo_templates/v2"

          def create_template(name, html_file):
              with open(html_file) as f:
                  html = f.read()
              r = requests.post(f"{BASE}/templates/", headers=H, json={
                  "data": {"type": "template", "attributes": {"name": name, "editor_type": "CODE", "html": html}}
              }, timeout=30)
              r.raise_for_status()
              tid = r.json()["data"]["id"]
              print(f"  ✅ Template: {tid} — {name}")
              return tid

          def create_flow_metric(name, metric_id):
              r = requests.post(f"{BASE}/flows/", headers=H, json={
                  "data": {
                      "type": "flow",
                      "attributes": {"name": name, "status": "draft"},
                      "relationships": {
                          "metric": {"data": {"type": "metric", "id": metric_id}}
                      }
                  }
              }, timeout=30)
              if not r.ok:
                  raise Exception(f"create_flow_metric({name}): {r.status_code} {r.text[:300]}")
              fid = r.json()["data"]["id"]
              print(f"  ✅ Flow: {fid} — {name}")
              return fid

          def create_flow_list(name, list_id):
              r = requests.post(f"{BASE}/flows/", headers=H, json={
                  "data": {
                      "type": "flow",
                      "attributes": {"name": name, "status": "draft"},
                      "relationships": {
                          "list": {"data": {"type": "list", "id": list_id}}
                      }
                  }
              }, timeout=30)
              if not r.ok:
                  raise Exception(f"create_flow_list({name}): {r.status_code} {r.text[:300]}")
              fid = r.json()["data"]["id"]
              print(f"  ✅ Flow: {fid} — {name}")
              return fid

          def get_flow_actions(flow_id):
              r = requests.get(f"{BASE}/flows/{flow_id}/flow-actions/", headers=H, timeout=30)
              r.raise_for_status()
              return r.json().get("data", [])

          def get_flow_messages(action_id):
              r = requests.get(f"{BASE}/flow-actions/{action_id}/flow-messages/", headers=H, timeout=30)
              r.raise_for_status()
              return r.json().get("data", [])

          def assign_template(message_id, template_id):
              r = requests.patch(f"{BASE}/flow-messages/{message_id}/relationships/template/", headers=H, json={
                  "data": {"type": "template", "id": template_id}
              }, timeout=30)
              if r.ok or r.status_code == 204:
                  print(f"    ✅ Assigned template {template_id} → message {message_id}")
                  return True
              else:
                  print(f"    ⚠️  Assign template: {r.status_code} {r.text[:200]}")
                  return False

          def wire_template(flow_id, template_id, step_index=0):
              """Get the flow's auto-created action+message and assign our template."""
              time.sleep(1)  # give Klaviyo a moment to create default actions
              actions = get_flow_actions(flow_id)
              if not actions:
                  print(f"    ⚠️  No actions found for flow {flow_id}")
                  return
              # Use the action at step_index (or last one)
              idx = min(step_index, len(actions) - 1)
              action_id = actions[idx]["id"]
              messages = get_flow_messages(action_id)
              if not messages:
                  print(f"    ⚠️  No messages found for action {action_id}")
                  return
              msg_id = messages[0]["id"]
              assign_template(msg_id, template_id)

          # ── Build templates ────────────────────────────────────────────────
          print("\n=== Creating v2 templates ===")
          T = {
              "welcome":     create_template("LB v2 — Welcome Series",        f"{V2}/lb_welcome_series.html"),
              "thank_you":   create_template("LB v2 — Customer Thank You",    f"{V2}/lb_customer_thank_you.html"),
              "abandoned_1": create_template("LB v2 — Abandoned Bag 1",       f"{V2}/lb_abandoned_bag_1.html"),
              "abandoned_2": create_template("LB v2 — Abandoned Bag 2",       f"{V2}/lb_abandoned_bag_2.html"),
              "browse":      create_template("LB v2 — Browse Abandonment",    f"{V2}/lb_browse_abandonment.html"),
              "shipping":    create_template("LB v2 — Shipping Confirmation", f"{V2}/lb_shipping_confirmation.html"),
              "out_delivery":create_template("LB v2 — Out for Delivery",      f"{V2}/lb_out_for_delivery.html"),
              "delivered":   create_template("LB v2 — Delivered + Review",    f"{V2}/lb_delivered_review.html"),
          }
          time.sleep(1)

          # ── Build flows + wire templates ───────────────────────────────────
          print("\n=== Creating flows ===")
          results = {}

          print("\n--- 1. Email Welcome Series ---")
          try:
              fid = create_flow_list("Email Welcome Series with Discount", EMAIL_LIST_ID)
              wire_template(fid, T["welcome"])
              results["welcome"] = fid
          except Exception as e: print(f"  ❌ {e}")
          time.sleep(1)

          print("\n--- 2. Customer Thank You ---")
          try:
              fid = create_flow_metric("Customer Thank You", M["placed_order"])
              wire_template(fid, T["thank_you"])
              results["thank_you"] = fid
          except Exception as e: print(f"  ❌ {e}")
          time.sleep(1)

          print("\n--- 3. Abandoned Cart ---")
          try:
              fid = create_flow_metric("Abandoned Cart Reminder - Shopify Added to Cart Trigger", M["checkout_started"])
              wire_template(fid, T["abandoned_1"], step_index=0)
              results["abandoned"] = fid
          except Exception as e: print(f"  ❌ {e}")
          time.sleep(1)

          print("\n--- 4. Browse Abandonment ---")
          try:
              fid = create_flow_metric("Browse Abandonment", M["viewed_product"])
              wire_template(fid, T["browse"])
              results["browse"] = fid
          except Exception as e: print(f"  ❌ {e}")
          time.sleep(1)

          print("\n--- 5. Shipping Confirmation ---")
          try:
              fid = create_flow_metric("LB — Shipping Confirmation", M["confirmed_shipment"])
              wire_template(fid, T["shipping"])
              results["shipping"] = fid
          except Exception as e: print(f"  ❌ {e}")
          time.sleep(1)

          print("\n--- 6. Out for Delivery ---")
          try:
              fid = create_flow_metric("LB — Out for Delivery", M["out_for_delivery"])
              wire_template(fid, T["out_delivery"])
              results["out_delivery"] = fid
          except Exception as e: print(f"  ❌ {e}")
          time.sleep(1)

          print("\n--- 7. Delivered + Review ---")
          try:
              fid = create_flow_metric("LB — Delivered + Review Request", M["delivered_shipment"])
              wire_template(fid, T["delivered"])
              results["delivered"] = fid
          except Exception as e: print(f"  ❌ {e}")

          print("\n\n=== SUMMARY ===")
          for name, fid in results.items():
              print(f"  ✅ {name}: {fid}")
          missing = [k for k in ["welcome","thank_you","abandoned","browse","shipping","out_delivery","delivered"] if k not in results]
          if missing:
              print(f"  ❌ Failed: {missing}")
              import sys; sys.exit(1)

          PYEOF
