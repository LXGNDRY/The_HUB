name: Klaviyo — Build All Flows From Scratch

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests

      - name: Build all 7 flows
        env:
          KLAVIYO_API_KEY: ${{ secrets.KLAVIYO_API_KEY }}
        run: |
          python3 - <<'PYEOF'
          import os, requests, json, time

          key = os.environ["KLAVIYO_API_KEY"]
          BASE = "https://a.klaviyo.com/api"
          H = {
              "Authorization": f"Klaviyo-API-Key {key}",
              "revision": "2024-10-15",
              "Content-Type": "application/json",
              "Accept": "application/json",
          }

          def api_get(path, params=None):
              r = requests.get(f"{BASE}/{path}", headers=H, params=params, timeout=30)
              r.raise_for_status()
              return r.json()

          def api_post(path, body):
              r = requests.post(f"{BASE}/{path}", headers=H, json=body, timeout=30)
              if not r.ok:
                  raise Exception(f"POST /{path} => {r.status_code}: {r.text[:400]}")
              return r.json()

          # ── Fetch metrics ──────────────────────────────────────────────────
          print("=== Fetching metrics ===")
          metrics = {}
          url = f"{BASE}/metrics/"
          while url:
              r = requests.get(url, headers=H, timeout=30)
              r.raise_for_status()
              data = r.json()
              for m in data.get("data", []):
                  metrics[m["attributes"]["name"]] = m["id"]
              url = data.get("links", {}).get("next")
              time.sleep(0.3)
          print(f"  Found {len(metrics)} metrics")
          for n, i in sorted(metrics.items()):
              print(f"  {i}  {n}")

          # ── Fetch lists ────────────────────────────────────────────────────
          print("\n=== Fetching lists ===")
          lists = {}
          r = requests.get(f"{BASE}/lists/", headers=H, timeout=30)
          r.raise_for_status()
          for l in r.json().get("data", []):
              lists[l["attributes"]["name"]] = l["id"]
              print(f"  {l['id']}  {l['attributes']['name']}")

          PYEOF
