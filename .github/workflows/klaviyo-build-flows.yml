name: Klaviyo — Build All Flows From Scratch

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests

      - name: Build all 7 flows
        env:
          KLAVIYO_API_KEY: ${{ secrets.KLAVIYO_API_KEY }}
        run: |
          python3 - <<'PYEOF'
          import os, requests, json, time

          key = os.environ["KLAVIYO_API_KEY"]
          BASE = "https://a.klaviyo.com/api"
          H = {
              "Authorization": f"Klaviyo-API-Key {key}",
              "revision": "2024-10-15",
              "Content-Type": "application/json",
              "Accept": "application/json",
          }
          V2 = "klaviyo_templates/v2"

          def create_template(name, html_file):
              with open(html_file) as f: html = f.read()
              r = requests.post(f"{BASE}/templates/", headers=H, json={
                  "data": {"type": "template", "attributes": {"name": name, "editor_type": "CODE", "html": html}}
              }, timeout=30)
              r.raise_for_status()
              tid = r.json()["data"]["id"]
              print(f"  ✅ Template {tid} — {name}")
              return tid

          def create_flow(name):
              r = requests.post(f"{BASE}/flows/", headers=H, json={
                  "data": {"type": "flow", "attributes": {"name": name, "status": "draft"}}
              }, timeout=30)
              if not r.ok:
                  raise Exception(f"{r.status_code}: {r.text[:300]}")
              fid = r.json()["data"]["id"]
              print(f"  ✅ Flow {fid} — {name}")
              return fid

          def wire_template(flow_id, template_id):
              time.sleep(2)
              r = requests.get(f"{BASE}/flows/{flow_id}/flow-actions/", headers=H, timeout=30)
              r.raise_for_status()
              actions = r.json().get("data", [])
              if not actions:
                  print(f"    ⚠️  No actions yet for {flow_id} — template not wired")
                  return False
              for action in actions:
                  mr = requests.get(f"{BASE}/flow-actions/{action['id']}/flow-messages/", headers=H, timeout=30)
                  mr.raise_for_status()
                  for msg in mr.json().get("data", []):
                      ar = requests.patch(f"{BASE}/flow-messages/{msg['id']}/relationships/template/", headers=H, json={
                          "data": {"type": "template", "id": template_id}
                      }, timeout=30)
                      if ar.ok or ar.status_code == 204:
                          print(f"    ✅ Template {template_id} → msg {msg['id']}")
                          return True
                      else:
                          print(f"    ⚠️  {ar.status_code}: {ar.text[:150]}")
              return False

          print("=== Creating fresh templates ===")
          T = {
              "welcome":      create_template("LB v2 — Welcome Series",        f"{V2}/lb_welcome_series.html"),
              "thank_you":    create_template("LB v2 — Customer Thank You",    f"{V2}/lb_customer_thank_you.html"),
              "abandoned_1":  create_template("LB v2 — Abandoned Bag 1",       f"{V2}/lb_abandoned_bag_1.html"),
              "abandoned_2":  create_template("LB v2 — Abandoned Bag 2",       f"{V2}/lb_abandoned_bag_2.html"),
              "browse":       create_template("LB v2 — Browse Abandonment",    f"{V2}/lb_browse_abandonment.html"),
              "shipping":     create_template("LB v2 — Shipping Confirmation", f"{V2}/lb_shipping_confirmation.html"),
              "out_delivery": create_template("LB v2 — Out for Delivery",      f"{V2}/lb_out_for_delivery.html"),
              "delivered":    create_template("LB v2 — Delivered + Review",    f"{V2}/lb_delivered_review.html"),
          }
          time.sleep(1)

          FLOWS = [
              ("Email Welcome Series with Discount", "welcome",      "Added to Email List → trigger manually"),
              ("Customer Thank You",                 "thank_you",    "Placed Order → trigger manually"),
              ("Abandoned Cart Reminder",            "abandoned_1",  "Checkout Started → trigger manually"),
              ("Browse Abandonment",                 "browse",       "Viewed Product → trigger manually"),
              ("LB — Shipping Confirmation",         "shipping",     "Confirmed Shipment → trigger manually"),
              ("LB — Out for Delivery",              "out_delivery", "Marked Out for Delivery → trigger manually"),
              ("LB — Delivered + Review Request",    "delivered",    "Delivered Shipment → trigger manually"),
          ]

          print("\n=== Creating flows ===")
          results = []
          for flow_name, tmpl_key, trigger_note in FLOWS:
              print(f"\n--- {flow_name} ---")
              try:
                  fid = create_flow(flow_name)
                  wired = wire_template(fid, T[tmpl_key])
                  results.append({
                      "flow": flow_name,
                      "flow_id": fid,
                      "template_id": T[tmpl_key],
                      "template_wired": wired,
                      "trigger_needed": trigger_note,
                  })
              except Exception as e:
                  print(f"  ❌ {e}")
                  results.append({"flow": flow_name, "error": str(e)})
              time.sleep(1)

          print("\n\n=== FINAL SUMMARY ===")
          for r in results:
              if "error" in r:
                  print(f"  ❌ {r['flow']}: {r['error']}")
              else:
                  wired = "✅" if r["template_wired"] else "⚠️ not wired"
                  print(f"  ✅ {r['flow_id']} | {r['flow']} | template {wired} | {r['trigger_needed']}")

          PYEOF
