name: GMC Supplemental Feed — Title Overrides

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'   # 1:00 AM CST (UTC-5) daily

jobs:
  install-supplemental-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install google-auth google-api-python-client requests

      - name: Apply keyword-optimised title overrides to GMC
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          SHOPIFY_ADMIN_TOKEN: ${{ secrets.SHOPIFY_ADMIN_TOKEN }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
        run: python scripts/gmc_supplemental_feed.py

