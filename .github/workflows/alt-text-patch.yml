name: Alt Text Bulk Patch

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run only (preview patches, no writes)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  patch-alt-text:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run alt text patch
        env:
          SHOPIFY_ADMIN_TOKEN: ${{ secrets.SHOPIFY_ADMIN_TOKEN }}
          SHOPIFY_STORE_DOMAIN: lngndny.myshopify.com
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: python scripts/alt_text_patch.py

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alt-text-report
          path: alt_text_report.json
          if-no-files-found: ignore
