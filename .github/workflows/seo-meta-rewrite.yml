name: SEO Meta Rewrite

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run only (preview, no writes)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      overwrite:
        description: 'Regenerate meta title/description even if already set (not just blanks)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  rewrite-seo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run SEO meta rewrite
        env:
          SHOPIFY_STORE_DOMAIN: lngndny.myshopify.com
          SHOPIFY_ADMIN_TOKEN: ${{ secrets.SHOPIFY_ADMIN_TOKEN }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -o pipefail
          ARGS=()
          if [ "${{ inputs.overwrite }}" = "true" ]; then
            ARGS+=(--overwrite)
          fi
          echo "## SEO Meta Rewrite" >> "$GITHUB_STEP_SUMMARY"
          echo "dry_run=${{ inputs.dry_run }}" >> "$GITHUB_STEP_SUMMARY"
          echo "overwrite=${{ inputs.overwrite }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python -u scripts/seo_meta_rewrite.py "${ARGS[@]}" 2>&1 | tee seo_meta_rewrite_output.txt
          cat seo_meta_rewrite_output.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-meta-rewrite-${{ github.run_id }}
          path: seo_meta_rewrite_output.txt
          retention-days: 90
