name: Product Description — Mass Update

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run only (preview, no writes)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  update-descriptions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run description updater
        env:
          SHOPIFY_ADMIN_TOKEN: ${{ secrets.SHOPIFY_ADMIN_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python scripts/product_description_updater.py --preview 5
          else
            python scripts/product_description_updater.py --execute
          fi

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: description-update-logs
          path: |
            logs/description_updates.log
            backups/original_descriptions.json
          if-no-files-found: ignore
