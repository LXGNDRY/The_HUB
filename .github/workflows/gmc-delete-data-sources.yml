name: GMC Delete Data Sources
on:
  workflow_dispatch:

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install google-auth google-api-python-client -q
      - run: python scripts/gmc_delete_data_sources.py
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
